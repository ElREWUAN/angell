<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Creaciones Angelle's</title>
    
    <style>
        /* VARIABLES DE COLOR: "Elegancia Botánica"   */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --primario: #4A5D54;       /* Verde Salvia Oscuro */
            --primario-suave: #627A6E; /* Salvia medio */
            --acento: #D4A373;         /* Arena Cálida */
            --fondo: #FAFAF7;          /* Crema perlado */
            --tarjeta-bg: #FFFFFF;     /* Blanco puro */
            --texto: #333D38;          /* Gris verdoso oscuro */
            --texto-claro: #839189;    /* Tono suave para subtítulos */
            --borde: #E6EBE8;          /* Líneas muy delicadas */
        }

        body, html {
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--fondo); color: var(--texto);
        }

        /* ESTRUCTURA DEL LOGIN */
        .login-wrapper {
            display: flex; width: 1000px; height: 550px; 
            background: var(--tarjeta-bg); border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(74, 93, 84, 0.08); overflow: hidden;
        }

        .login-banner {
            flex: 1.2; background: linear-gradient(135deg, var(--primario) 0%, var(--primario-suave) 100%);
            color: white; display: flex; justify-content: center; 
            align-items: center; text-align: center; padding: 50px;
        }

        .banner-content h1 { font-size: 2.8rem; margin-bottom: 15px; color: white; margin-top: 0; }
        .banner-content p { font-size: 1.2rem; opacity: 0.9; font-weight: 400; color: var(--fondo); margin: 0; }

        .login-form-container { flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center; }
        .login-form h2 { color: var(--primario); margin-top: 0; margin-bottom: 8px; font-size: 2rem; }
        .login-subtexto { color: var(--texto-claro); font-size: 1rem; margin-bottom: 40px; }

        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.95rem; color: var(--primario); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px 18px; border: 2px solid var(--borde); 
            border-radius: 12px; font-family: inherit; background-color: var(--tarjeta-bg); 
            transition: all 0.3s ease; color: var(--texto); box-sizing: border-box; font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 4px rgba(212, 163, 115, 0.15); }

        .btn-primario {
            background-color: var(--primario); color: white; border: none; 
            padding: 16px 30px; border-radius: 12px; cursor: pointer; width: 100%; 
            font-size: 1.05rem; font-weight: 600; margin-top: 25px; 
            transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(74, 93, 84, 0.2);
        }
        .btn-primario:hover { background-color: var(--primario-suave); transform: translateY(-2px); }

        /* NUEVAS VENTANAS ELEGANTES (MODALES)        */
        
        /* 1. Pantalla de Carga/Bienvenida */
        .welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(250, 250, 247, 0.95); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            flex-direction: column; z-index: 9999;
            opacity: 0; animation: fadeIn 0.4s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .spinner {
            width: 60px; height: 60px; border: 5px solid var(--borde);
            border-top-color: var(--primario); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .welcome-overlay h2 { color: var(--primario); font-size: 2.2rem; margin: 0; }
        .welcome-overlay p { color: var(--acento); font-size: 1.2rem; font-weight: 600; }

        /* 2. Ventana de Error */
        .alerta-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .alerta-contenido {
            background: var(--tarjeta-bg); padding: 40px; border-radius: 20px;
            text-align: center; max-width: 350px; box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .alerta-contenido h3 { color: var(--primario); margin: 10px 0; }
        .alerta-contenido p { color: var(--texto-claro); margin-bottom: 20px; }
        .btn-cerrar { background: var(--primario); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-banner">
            <div class="banner-content">
                <h1>Creaciones Angelle's</h1>
                <p>Sistema de Gestión de Eventos e Inventario</p>
            </div>
        </div>

        <div class="login-form-container">
            <form id="loginForm" class="login-form">
                <h2>Bienvenido</h2>
                <p class="login-subtexto">Por favor ingresa tus credenciales reales</p>

                <div class="form-group">
                    <label for="usuario">Tipo de Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej: Administrador o Empleado" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-primario" id="btnIngresar">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <div id="welcome-overlay" class="welcome-overlay">
        <div class="spinner"></div>
        <h2>¡Bienvenido, <span id="welcome-user"></span>!</h2>
        <p>Iniciando sesión como <span id="welcome-role"></span>...</p>
    </div>

    <div id="mi-alerta" class="alerta-modal">
        <div class="alerta-contenido">
            <div id="alerta-icono" style="font-size: 3rem; margin-bottom: 10px;">❌</div>
            <h3 id="alerta-titulo">Error</h3>
            <p id="alerta-mensaje">Mensaje de error</p>
            <button class="btn-cerrar" onclick="cerrarAlerta()">Intentar de nuevo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
